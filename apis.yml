aid: i-pulse
name: I-Pulse
description: >-
  I-Pulse Inc. is a U.S.-based industrial technology company founded in 2007 by
  Robert Friedland and Laurent Frescaline that commercializes High Pulsed Power
  (HPP) — releasing very short, extremely high-power electrical discharges from
  small amounts of stored energy to generate magnetic forces, shockwaves,
  electrical arcs and electric fields. I-Pulse holds 55 patents licensed
  exclusively to its operating businesses across natural-resource
  transformation (I-ROX rock comminution, I-Mine, iTerra non-chemical weed
  control, IPW), the energy transition (G-Pulse pulsed-power geothermal
  drilling, Blue Spark Geothermal), manufacturing (Bmax electromagnetic metal
  forming and welding, CSI Technologies high-energy capacitors) and R&D (I-Cube,
  Typhoon). It operates from Albuquerque, New Mexico and Toulouse, France, with
  offices in Canada, the UK and Singapore, and signed a $250 million CHIPS R&D
  award with the U.S. Department of Commerce in 2026 for semiconductor and
  pulsed-power development. I-Pulse is a hardware and industrial-process
  company; it publishes no developer program, API documentation or
  machine-readable API contract.
